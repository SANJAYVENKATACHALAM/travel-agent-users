<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <link
        rel="stylesheet"
        href="/static/css/login.css"
    >

</head>

<body>

<div class="container">

    <div class="login-card">

        <h1>AI Travel Planner</h1>

        <p>Login to continue</p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p>

            Don't have an account?

            <a href="/signup">
                Sign Up
            </a>

        </p>

        <div id="message"></div>

    </div>

</div>

<script src="/static/js/login.js"></script>

</body>
</html>
