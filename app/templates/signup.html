<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Sign Up</title>

<link rel="stylesheet"
href="/static/css/signup.css">

</head>

<body>

<div class="container">

<div class="signup-card">

<h1>Create Account</h1>

<p>Join AI Travel Planner</p>

<form id="signupForm">

<input
type="text"
id="name"
placeholder="Full Name"
required>

<input
type="email"
id="email"
placeholder="Email"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<div id="strength"></div>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

<button type="submit">

Create Account

</button>

</form>

<p>

Already have an account?

<a href="/login">

Login

</a>

</p>

<div id="message"></div>

</div>

</div>

<script src="/static/js/signup.js"></script>

</body>
</html>
